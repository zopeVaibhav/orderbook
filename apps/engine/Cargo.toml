[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bincode = "1.3"
dotenvy = "0.15.7"
rdkafka = { version = "0.39.0", features = ["tokio"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["time", "macros", "rt-multi-thread"] }
