services:
    postgres:
        image: postgres:17-alpine
        container_name: orderbook-postgres
        restart: unless-stopped
        env_file:
            - ../.env
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 10

    redpanda:
        image: redpandadata/redpanda:latest
        container_name: redpanda
        command:
            - redpanda
            - start
            - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
            - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
            - --smp=1
            - --memory=1G
            - --overprovisioned
            - --node-id=0
            - --check=false
        ports:
            - '9092:9092'
            - '9644:9644'

    topic-init:
        image: redpandadata/redpanda:latest
        depends_on: [redpanda]
        entrypoint: /bin/sh
        command:
            - -c
            - |
                set -e
                rpk cluster health -X admin.hosts=redpanda:9644
                rpk topic create orders.in orders.ack trades.out book.delta -p 1 -X brokers=redpanda:29092 || true
                rpk topic create markets.control -p 1 -c cleanup.policy=compact -X brokers=redpanda:29092 || true
        restart: on-failure

    console:
        image: redpandadata/console:latest
        container_name: redpanda-console
        depends_on:
            - redpanda
        ports:
            # Host 8090, not 8080: 8080 is the API server (SERVER_PORT in .env).
            - '8090:8080'
        environment:
            KAFKA_BROKERS: redpanda:29092

volumes:
    postgres-data:
